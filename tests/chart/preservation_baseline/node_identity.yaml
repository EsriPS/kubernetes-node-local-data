apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: geodata-nodes
spec:
  amiSelectorTerms:
  - alias: bottlerocket@v1.32.0
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: 4Gi
      volumeType: gp3
  - deviceName: /dev/xvdb
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: 200Gi
      volumeType: gp3
  role: KarpenterNodeRole-geodata
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: geodata-cluster
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: geodata-cluster
  tags:
    data.example.com/component: node-local-data-stores
  userData: '[settings.bootstrap-commands.geodata-nvme]

    commands = [["apiclient", "ephemeral-storage", "init"], ["apiclient", "ephemeral-storage",
    "bind", "--dirs", "/mnt/geodata"]]

    mode = "always"

    essential = true

    '
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: geodata-nodes
spec:
  disruption:
    budgets:
    - nodes: '0'
    consolidateAfter: Never
    consolidationPolicy: WhenEmpty
  limits:
    cpu: 144
    nodes: '3'
  template:
    metadata:
      labels:
        data.example.com/workload: geodata
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: geodata-nodes
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      - key: kubernetes.io/os
        operator: In
        values:
        - linux
      - key: topology.kubernetes.io/zone
        operator: In
        values:
        - us-east-1a
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values:
        - c
        - m
        - r
        - i
      - key: karpenter.k8s.aws/instance-generation
        operator: Gt
        values:
        - '7'
      - key: karpenter.k8s.aws/instance-cpu
        operator: Gt
        values:
        - '7'
      - key: karpenter.k8s.aws/instance-memory
        operator: Gt
        values:
        - '32767'
      - key: karpenter.k8s.aws/instance-local-nvme
        operator: Gt
        values:
        - '1199'
      - key: karpenter.k8s.aws/instance-network-bandwidth
        operator: Gt
        values:
        - '16000'
      startupTaints:
      - effect: NoSchedule
        key: data.example.com/data-not-ready
        value: 'true'
      taints:
      - effect: NoSchedule
        key: data.example.com/dedicated
        value: geodata
